AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Gravity fitness tracker API - ASP.NET Core Minimal API on Lambda with DynamoDB

Parameters:
  TablePrefix:
    Type: String
    Default: Gravity_
    Description: Prefix applied to every table name.
  JwtSecret:
    Type: String
    NoEcho: true
    Description: HS256 signing secret. Must match the previous backend's JWT_SECRET, or tokens already stored on devices stop working.
  ClientOrigin:
    Type: String
    Default: ""
    Description: Allowed CORS origin. Required when Environment is production.
  Environment:
    Type: String
    Default: production
    AllowedValues: [production, development]
  EmailFromAddress:
    Type: String
    Default: ""
    Description: SES-verified sender identity used for account recovery emails. Required when EmailSender is "ses".
  EmailSender:
    Type: String
    Default: ses
    AllowedValues: [ses, console]
    Description: '"console" logs emails instead of sending them -- useful for a throwaway/testing stack.'

Globals:
  Function:
    Runtime: dotnet10
    MemorySize: 1024
    Timeout: 30
    Architectures: [x86_64]

Resources:
  GravityApi:
    Type: AWS::Serverless::Function
    Properties:
      # AddAWSLambdaHosting bootstraps the whole ASP.NET pipeline, so the
      # handler is just the assembly name.
      Handler: Gravity.Api
      CodeUri: src/Gravity.Api/
      # SnapStart only ever applies to a published version, never $LATEST --
      # AutoPublishAlias makes SAM publish one on every deploy and points API
      # Gateway's integration at the alias instead of the bare function ARN.
      AutoPublishAlias: live
      SnapStart:
        ApplyOn: PublishedVersions
      Environment:
        Variables:
          TABLE_PREFIX: !Ref TablePrefix
          JWT_SECRET: !Ref JwtSecret
          CLIENT_ORIGIN: !Ref ClientOrigin
          NODE_ENV: !Ref Environment
          EMAIL_FROM_ADDRESS: !Ref EmailFromAddress
          EMAIL_SENDER: !Ref EmailSender
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:BatchGetItem
                - dynamodb:Query
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:BatchWriteItem
                - dynamodb:TransactWriteItems
              Resource:
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TablePrefix}*
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TablePrefix}*/index/*
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource:
                - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${EmailFromAddress}
      Events:
        # One catch-all route; the ASP.NET router does the dispatching.
        Proxy:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
        Root:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${TablePrefix}Users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: id, AttributeType: N}
      KeySchema:
        - {AttributeName: id, KeyType: HASH}

  # Lookup table enforcing username uniqueness via a conditional write inside
  # the same transaction that creates or renames the user.
  UsernamesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${TablePrefix}Usernames
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: username, AttributeType: S}
      KeySchema:
        - {AttributeName: username, KeyType: HASH}

  # Atomic counters standing in for Postgres autoincrement.
  CountersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${TablePrefix}Counters
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: entity, AttributeType: S}
      KeySchema:
        - {AttributeName: entity, KeyType: HASH}

  # Fixed-window counters for the API's rate limiter (see Common/RateLimiter.cs).
  # TTL prunes windows automatically; nothing else ever deletes from this table.
  RateLimitsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${TablePrefix}RateLimits
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: key, AttributeType: S}
      KeySchema:
        - {AttributeName: key, KeyType: HASH}
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # Lookup table enforcing email uniqueness -- only confirmed emails are ever
  # written here; pending/unconfirmed targets live solely on
  # EmailConfirmationCodesTable until confirmed. Same conditional-write pattern
  # as UsernamesTable.
  EmailsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${TablePrefix}Emails
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: email, AttributeType: S}
      KeySchema:
        - {AttributeName: email, KeyType: HASH}

  # One outstanding password-reset code per email; TTL prunes it automatically.
  PasswordResetCodesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${TablePrefix}PasswordResetCodes
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: email, AttributeType: S}
      KeySchema:
        - {AttributeName: email, KeyType: HASH}
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # One outstanding pending-email confirmation per user (serves both add-email
  # and change-email); TTL expiry silently clears "pending" state.
  EmailConfirmationCodesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${TablePrefix}EmailConfirmationCodes
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: userId, AttributeType: N}
      KeySchema:
        - {AttributeName: userId, KeyType: HASH}
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # Lookup tables enforcing name uniqueness per parent (userId for workouts,
  # workoutId for exercises), the same conditional-put pattern as Usernames.
  WorkoutNamesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${TablePrefix}WorkoutNames
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: userId, AttributeType: N}
        - {AttributeName: name, AttributeType: S}
      KeySchema:
        - {AttributeName: userId, KeyType: HASH}
        - {AttributeName: name, KeyType: RANGE}

  ExerciseNamesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${TablePrefix}ExerciseNames
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: workoutId, AttributeType: N}
        - {AttributeName: name, AttributeType: S}
      KeySchema:
        - {AttributeName: workoutId, KeyType: HASH}
        - {AttributeName: name, KeyType: RANGE}

  WorkoutsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${TablePrefix}Workouts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: userId, AttributeType: N}
        - {AttributeName: id, AttributeType: N}
        - {AttributeName: order, AttributeType: N}
      KeySchema:
        - {AttributeName: userId, KeyType: HASH}
        - {AttributeName: id, KeyType: RANGE}
      LocalSecondaryIndexes:
        - IndexName: order-index
          KeySchema:
            - {AttributeName: userId, KeyType: HASH}
            - {AttributeName: order, KeyType: RANGE}
          Projection: {ProjectionType: ALL}

  ExercisesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${TablePrefix}Exercises
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: workoutId, AttributeType: N}
        - {AttributeName: id, AttributeType: N}
        - {AttributeName: order, AttributeType: N}
      KeySchema:
        - {AttributeName: workoutId, KeyType: HASH}
        - {AttributeName: id, KeyType: RANGE}
      LocalSecondaryIndexes:
        - IndexName: order-index
          KeySchema:
            - {AttributeName: workoutId, KeyType: HASH}
            - {AttributeName: order, KeyType: RANGE}
          Projection: {ProjectionType: ALL}

  WorkoutSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${TablePrefix}WorkoutSessions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: userId, AttributeType: N}
        - {AttributeName: id, AttributeType: N}
        - {AttributeName: date, AttributeType: S}
        - {AttributeName: workoutId, AttributeType: N}
      KeySchema:
        - {AttributeName: userId, KeyType: HASH}
        - {AttributeName: id, KeyType: RANGE}
      LocalSecondaryIndexes:
        # Serves the history calendar's month window.
        - IndexName: date-index
          KeySchema:
            - {AttributeName: userId, KeyType: HASH}
            - {AttributeName: date, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
      GlobalSecondaryIndexes:
        # Used when cascading a workout delete down to its sessions.
        - IndexName: workoutId-date-index
          KeySchema:
            - {AttributeName: workoutId, KeyType: HASH}
            - {AttributeName: date, KeyType: RANGE}
          Projection: {ProjectionType: ALL}

  ExerciseSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${TablePrefix}ExerciseSessions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: workoutSessionId, AttributeType: N}
        - {AttributeName: id, AttributeType: N}
        - {AttributeName: exerciseId, AttributeType: N}
        - {AttributeName: sessionDate, AttributeType: S}
      KeySchema:
        - {AttributeName: workoutSessionId, KeyType: HASH}
        - {AttributeName: id, KeyType: RANGE}
      GlobalSecondaryIndexes:
        # Backs /averages and /previous-set-count, which query across sessions
        # by exercise. sessionDate is denormalized from the parent session.
        - IndexName: exerciseId-sessionDate-index
          KeySchema:
            - {AttributeName: exerciseId, KeyType: HASH}
            - {AttributeName: sessionDate, KeyType: RANGE}
          Projection: {ProjectionType: ALL}

  SetSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${TablePrefix}SetSessions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: exerciseSessionId, AttributeType: N}
        - {AttributeName: id, AttributeType: N}
      KeySchema:
        - {AttributeName: exerciseSessionId, KeyType: HASH}
        # id as the sort key gives the `orderBy: { id: "asc" }` the sets list needs.
        - {AttributeName: id, KeyType: RANGE}

Outputs:
  ApiUrl:
    Description: Base URL to put in workout-app/.env as EXPO_PUBLIC_API_URL
    Value: !Sub https://${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
